<svg width="380" height="480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EBE3D5"/>
      <stop offset="40%" stop-color="#F4EEE4"/>
      <stop offset="90%" stop-color="#FDFBF7"/>
      <stop offset="98%" stop-color="#D9CBBB"/>
      <stop offset="100%" stop-color="#B8A794"/>
    </linearGradient>
    <radialGradient id="wear" cx="10%" cy="10%" r="90%">
      <stop offset="70%" stop-color="black" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8c775a" stop-opacity="0.3"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="-2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect x="10" y="5" width="370" height="470" rx="3" ry="3" fill="url(#pageGrad)" filter="url(#shadow)"/>
  <rect x="10" y="5" width="370" height="470" rx="3" ry="3" fill="url(#wear)" />
  
  <!-- Textbook Content Overlay -->
  <g transform="translate(30, 40)" opacity="0.8">
    <text x="0" y="0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2C445E">CHAPTER 6</text>
    <rect x="0" y="8" width="330" height="2" fill="#2C445E"/>
    <text x="0" y="30" font-family="sans-serif" font-size="22" font-weight="bold" fill="#333">WORK AND ENERGY</text>
    
    <text x="0" y="65" font-family="serif" font-size="13" fill="#444">
      <tspan x="0" dy="0">The work done by a constant force is given</tspan>
      <tspan x="0" dy="16">by the product of the force and the</tspan>
      <tspan x="0" dy="16">displacement in the direction of the force.</tspan>
      <tspan x="0" dy="16">This is a scalar quantity, although both</tspan>
      <tspan x="0" dy="16">force and displacement are vectors.</tspan>
    </text>
    
    <!-- Equation Box -->
    <rect x="40" y="110" width="230" height="40" fill="#E8F0F8" stroke="#B0C4DE" rx="4"/>
    <text x="155" y="137" font-family="serif" font-style="italic" font-size="18" fill="#222" text-anchor="middle">W = F · s cos(θ)</text>
    
    <!-- Diagram -->
    <g transform="translate(60, 180)">
      <line x1="0" y1="60" x2="180" y2="60" stroke="#666" stroke-width="2"/>
      <rect x="30" y="30" width="40" height="30" fill="#CCC" stroke="#666"/>
      <line x1="70" y1="45" x2="140" y2="20" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="145" y="15" font-family="serif" font-style="italic" font-size="12" fill="#333">F</text>
      <text x="45" y="25" font-family="serif" font-style="italic" font-size="12" fill="#333">m</text>
      <path d="M 100 60 A 40 40 0 0 0 110 30" fill="none" stroke="#666"/>
      <text x="115" y="50" font-family="serif" font-style="italic" font-size="12" fill="#666">θ</text>
    </g>
    
    <!-- Example -->
    <rect x="0" y="270" width="310" height="110" fill="#F9F6F0" stroke="#DDD" rx="2"/>
    <rect x="0" y="270" width="70" height="18" fill="#2C445E" rx="2"/>
    <text x="35" y="283" font-family="sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">EXAMPLE</text>
    <text x="10" y="310" font-family="serif" font-size="12" fill="#444">
      <tspan x="10" dy="0">A force of 10 N is applied on a body at</tspan>
      <tspan x="10" dy="16">an angle of 30° and it moves 5 m.</tspan>
      <tspan x="10" dy="16">Find the work done.</tspan>
      <tspan x="10" dy="20" font-weight="bold">Solution:</tspan>
      <tspan x="10" dy="16" font-style="italic">W = 10 × 5 × cos(30°) = 43.3 J</tspan>
    </text>
  </g>
</svg>
