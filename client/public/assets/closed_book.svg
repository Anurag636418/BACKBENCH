<svg width="450" height="520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cover Gradient -->
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A2A3A"/>
      <stop offset="2%" stop-color="#2C445E"/>
      <stop offset="100%" stop-color="#15222F"/>
    </linearGradient>
    
    <!-- Paper Edge Gradient -->
    <linearGradient id="paperEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="50%" stop-color="#D9CBBB"/>
      <stop offset="100%" stop-color="#BCA993"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="15" dy="25" stdDeviation="15" flood-opacity="0.7" flood-color="#000"/>
    </filter>
  </defs>

  <!-- The shadow and back cover base -->
  <g filter="url(#shadow)">
    <rect x="25" y="15" width="400" height="490" rx="8" ry="8" fill="#101820" />
  </g>

  <!-- Paper block (thickness) -->
  <path d="M 35 15 L 430 15 L 430 485 L 35 485 Z" fill="url(#paperEdge)" />
  
  <!-- Add subtle lines to simulate pages in the block -->
  <line x1="430" y1="20" x2="430" y2="480" stroke="#a08d79" stroke-width="2" stroke-dasharray="2,2"/>
  <line x1="428" y1="20" x2="428" y2="480" stroke="#c0a993" stroke-width="1" />

  <!-- Front Cover -->
  <rect x="15" y="10" width="410" height="495" rx="5" ry="5" fill="url(#coverGrad)" />
  
  <!-- Spine detailing -->
  <rect x="15" y="10" width="30" height="495" fill="#0A1520" />
  <rect x="40" y="10" width="2" height="495" fill="#3B5773" />
  <rect x="42" y="10" width="5" height="495" fill="#111D29" />

  <!-- Cover Title -->
  <text x="210" y="240" font-family="serif" font-size="32" font-weight="bold" fill="#D4AF37" text-anchor="middle" opacity="0.8">ADVANCED PHYSICS</text>
  <text x="210" y="270" font-family="serif" font-size="18" fill="#D4AF37" text-anchor="middle" opacity="0.6">Vol. II</text>
  
  <rect x="80" y="180" width="260" height="120" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.5"/>
</svg>
